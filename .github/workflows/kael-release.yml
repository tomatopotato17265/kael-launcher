name: Kael release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kael-release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  release:
    name: Release (${{ matrix.rust_target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis --bundles msi'
          - platform: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu --bundles appimage --bundles rpm'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare production environment
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Sync version from release tag
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          jq --arg version "$VERSION" '.version = $version' apps/app-frontend/package.json > apps/app-frontend/package.json.tmp
          mv apps/app-frontend/package.json.tmp apps/app-frontend/package.json
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" apps/app/Cargo.toml
          rm -f apps/app/Cargo.toml.bak
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" packages/app-lib/Cargo.toml
          rm -f packages/app-lib/Cargo.toml.bak
          echo "Synced version to ${VERSION} for tag ${RELEASE_TAG}"

      # Code signing is not configured yet. When certificates are available:
      # - macOS: set APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_TEAM_ID,
      #   APPLE_PASSWORD, and enable notarization env vars on the tauri-action step below.
      # - Windows: configure signCommand in a Kael-specific release config or pass
      #   DIGICERT_ONE_SIGNER_* env vars and use --config tauri-release.conf.json.
      # - Updater: set TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      #   and a dedicated updater endpoint when an update CDN is ready.

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ matrix.platform == 'macos-latest' && 'true' || '' }}
        with:
          projectPath: apps/app
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Kael Launcher ${{ env.RELEASE_TAG }}
          releaseBody: Draft release for ${{ env.RELEASE_TAG }}. Review all platform artifacts before publishing.
          releaseDraft: true
          uploadUpdaterJson: false
          retryAttempts: 3
          args: ${{ matrix.args }}
