name: Kael build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kael-build.yml
      - apps/app/**
      - apps/app-frontend/**
      - packages/app-lib/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.rust_target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis --bundles msi'
          - platform: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu --bundles appimage --bundles rpm'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare production environment
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      # Code signing is not configured yet. When certificates are available, add
      # macOS signing env vars (APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY, etc.)
      # and Windows signing via tauri-release.conf.json signCommand or equivalent.

      - name: Build Kael Launcher
        run: pnpm --filter=@kael/app run tauri build ${{ matrix.args }}
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ matrix.platform == 'macos-latest' && 'true' || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kael Launcher (${{ matrix.rust_target }})
          path: |
            target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.rust_target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
