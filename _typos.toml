[files]
extend-exclude = [
  "**/src/locales/",
  "apps/frontend/",
  "patches/",
  "packages/utils/",
  "packages/ui/",
  "packages/blog/",
  # contains licenses like `CC-BY-ND-4.0`
  "packages/moderation/src/data/stages/license.ts",
]

[default.extend-words]
# Terms Of Use in `tou-link`
tou = "tou"
# Google Ad Manager
gam = "gam"
# short for "constants"
consts = "consts"
# short for "Copy"
Cpy = "Cpy"
