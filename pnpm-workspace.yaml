packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

patchedDependencies:
  readable-stream@2.3.8: patches/readable-stream@2.3.8.patch

peerDependencyRules:
  allowedVersions:
    vite: '8'
    esbuild: '0'

minimumReleaseAge: 10080
